name: Clean up demos

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      event:
        description: Event ID from cleanup-events.json (blank checks all recorded events)
        type: string
      dry_run:
        description: Preview retained and eligible repos without deleting
        type: boolean
        default: true
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cleanup-demos
  cancel-in-progress: false

env:
  ORG: octobooth

jobs:
  cleanup:
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve options
        id: opts
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EVENT: ${{ inputs.event }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          event=""
          dry_run=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              event="${INPUT_EVENT:-}"
              dry_run="${INPUT_DRY_RUN:-true}"
              ;;
            issue_comment)
              first_line=$(printf '%s\n' "$COMMENT_BODY" | head -n 1 | tr -d '\r')
              read -r -a words <<< "$first_line"
              if [ "${words[0]:-}" != "/cleanup" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              dry_run=true
              for ((i=1; i<${#words[@]}; i++)); do
                case "${words[$i]}" in
                  --dry-run) dry_run=true ;;
                  --confirm) dry_run=false ;;
                  --event) i=$((i + 1)); event="${words[$i]:-}"; [ -n "$event" ] || { echo "::error::--event requires an ID"; exit 1; } ;;
                  *) echo "::error::Unsupported cleanup option. Use /cleanup [--event ID] [--dry-run | --confirm]. Age/all overrides cannot bypass retention and review."; exit 1 ;;
                esac
              done
              ;;
          esac
          if [ -n "$event" ] && ! [[ "$event" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid event ID."
            exit 1
          fi
          {
            echo "run=true"
            echo "event=$event"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      - name: Check commenter permission
        if: github.event_name == 'issue_comment' && steps.opts.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission')
          case "$permission" in
            admin|maintain|write) echo "$ACTOR has $permission permission." ;;
            *) echo "::error::Write access is required."; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: steps.opts.outputs.run == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.opts.outputs.run == 'true'
        with:
          node-version: 22

      - name: Create GitHub App token
        id: app-token
        if: steps.opts.outputs.run == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: octobooth

      - name: Check reviewed event scope and clean up
        id: cleanup
        if: steps.opts.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONTROL_REPO: ${{ github.repository }}
          EVENT_ID: ${{ steps.opts.outputs.event }}
          DRY_RUN: ${{ steps.opts.outputs.dry_run }}
        run: |
          args=(--control-repo "$CONTROL_REPO" --owner "$ORG" --json)
          [ -z "$EVENT_ID" ] || args+=(--event "$EVENT_ID")
          [ "$DRY_RUN" = true ] || args+=(--execute)
          status=0
          node scripts/event-cleanup.mjs "${args[@]}" > "$RUNNER_TEMP/cleanup-result.json" || status=$?
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/cleanup-result.json`, "utf8"));
          const lines = ["### Event demo cleanup", "", `Eligible: ${result.eligible.length}. Retained: ${result.retained.length}. Deleted: ${result.deleted.length}.`];
          for (const item of result.retained) lines.push(`- Retained ${item.repo}: ${item.reason}`);
          for (const item of result.eligible) lines.push(`- Eligible ${item.repo}: event ${item.event}`);
          for (const repo of result.deleted) lines.push(`- Deleted ${repo}`);
          if (result.error) lines.push(`\nCleanup stopped: ${result.error}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          JS
          exit "$status"

      - name: Comment result
        if: always() && github.event_name == 'issue_comment' && steps.opts.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.cleanup.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Cleanup outcome: $OUTCOME. [See retained, eligible, deleted scope and any errors]($RUN_URL). Deletion requires event end + seven days and recorded DevRel/DRI approval of the exact scope; --confirm does not grant that approval."
          gh issue comment "$ISSUE" --repo "$REPO" --body "$body"
